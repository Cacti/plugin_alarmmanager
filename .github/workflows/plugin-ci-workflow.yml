name: Plugin Integration Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  integration-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        cacti: ['1.2.x', 'develop']
        php: ['8.2', '8.3', '8.4']

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: cactiroot
          MYSQL_DATABASE: cacti
          MYSQL_USER: cactiuser
          MYSQL_PASSWORD: cactiuser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    name: PHP ${{ matrix.php }} / Cacti ${{ matrix.cacti }} Integration Test

    env:
      CACTI_PATH: ${{ github.workspace }}/cacti
      ALARMMANAGER_CACTI_ROOT: ${{ github.workspace }}/cacti

    steps:
    - name: Checkout Cacti
      uses: actions/checkout@v4
      with:
        repository: Cacti/cacti
        ref: ${{ matrix.cacti }}
        path: cacti

    - name: Checkout Alarm Manager Plugin
      uses: actions/checkout@v4
      with:
        path: cacti/plugins/alarmmanager

    - name: Install PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: intl, mysql, gd, xml, curl, json, mbstring
        ini-values: "post_max_size=256M, max_execution_time=120, date.timezone=UTC"

    - name: Check PHP version
      run: php -v

    - name: Run apt-get update
      run: sudo apt-get update

    - name: Install System Dependencies
      run: sudo apt-get install -y rrdtool

    - name: Setup Permissions
      run: |
        sudo chown -R www-data:runner ${{ github.workspace }}/cacti
        sudo find ${{ github.workspace }}/cacti -type d -exec chmod 775 {} \;
        sudo find ${{ github.workspace }}/cacti -type f -exec chmod 664 {} \;
        sudo chmod +x ${{ github.workspace }}/cacti/cmd.php
        sudo chmod +x ${{ github.workspace }}/cacti/poller.php

    - name: Create MySQL Config
      run: |
        echo -e "[client]\nuser = root\npassword = cactiroot\nhost = 127.0.0.1\n" > ~/.my.cnf
        cat ~/.my.cnf

    - name: Initialize Cacti Database
      env:
        MYSQL_AUTH_USR: '--defaults-file=~/.my.cnf'
      run: |
        mysql $MYSQL_AUTH_USR -e 'CREATE DATABASE IF NOT EXISTS cacti;'
        mysql $MYSQL_AUTH_USR -e "CREATE USER IF NOT EXISTS 'cactiuser'@'localhost' IDENTIFIED BY 'cactiuser';"
        mysql $MYSQL_AUTH_USR -e "GRANT ALL PRIVILEGES ON cacti.* TO 'cactiuser'@'localhost';"
        mysql $MYSQL_AUTH_USR -e "GRANT SELECT ON mysql.time_zone_name TO 'cactiuser'@'localhost';"
        mysql $MYSQL_AUTH_USR -e "FLUSH PRIVILEGES;"
        mysql $MYSQL_AUTH_USR cacti < ${{ github.workspace }}/cacti/cacti.sql
        mysql $MYSQL_AUTH_USR -e "INSERT INTO settings (name, value) VALUES ('path_php_binary', '/usr/bin/php')" cacti

    - name: Initialize the Dedicated Integration Test Database
      env:
        MYSQL_AUTH_USR: '--defaults-file=~/.my.cnf'
      run: |
        mysql $MYSQL_AUTH_USR -e "CREATE DATABASE IF NOT EXISTS alarmmanager_test;"
        mysql $MYSQL_AUTH_USR -e "GRANT ALL PRIVILEGES ON alarmmanager_test.* TO 'cactiuser'@'localhost';"
        mysql $MYSQL_AUTH_USR -e "FLUSH PRIVILEGES;"

    - name: Install Composer Dependencies
      run: |
        cd ${{ github.workspace }}/cacti
        composer install --no-progress

    - name: Create Cacti config.php
      run: |
        cat ${{ github.workspace }}/cacti/include/config.php.dist | \
        sed -r "s/localhost/127.0.0.1/g" > ${{ github.workspace }}/cacti/include/config.php
        sudo chmod 664 ${{ github.workspace }}/cacti/include/config.php
        grep -E "database_(default|type|hostname|username|password)" ${{ github.workspace }}/cacti/include/config.php || true

    - name: Install Cacti via CLI
      run: |
        cd ${{ github.workspace }}/cacti
        sudo php cli/install_cacti.php --accept-eula --install --force

    - name: Install Alarm Manager Plugin
      run: |
        cd ${{ github.workspace }}/cacti
        sudo php cli/plugin_manage.php --plugin=alarmmanager --install --enable

    - name: Check PHP Syntax for Plugin
      run: |
        cd ${{ github.workspace }}/cacti/plugins/alarmmanager
        if find . -name '*.php' -exec php -l {} \; 2>&1 | grep -iv 'no syntax errors detected'; then
          echo "Syntax errors found!"
          exit 1
        fi

    - name: Check the Plugin CLI Entry Points
      run: |
        cd ${{ github.workspace }}/cacti
        for script in status worker supervisor remote submit_event credentials producers configure setup_local endpoint; do
          php -q plugins/alarmmanager/cli/$script.php --help >/dev/null || exit 1
        done

    - name: Run Cacti Poller
      run: |
        cd ${{ github.workspace }}/cacti
        sudo php poller.php --poller=1 --force --debug
        if ! grep -q "SYSTEM STATS" log/cacti.log; then
          echo "Cacti poller did not finish successfully"
          cat log/cacti.log
          exit 1
        fi

    - name: Run Plugin Test Suite (unit lane)
      run: |
        cd ${{ github.workspace }}/cacti
        include/vendor/bin/pest --configuration=plugins/alarmmanager/phpunit.xml

    - name: Run Plugin Test Suite (integration lane)
      env:
        ALARMMANAGER_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=alarmmanager_test;charset=utf8mb4'
        ALARMMANAGER_TEST_USER: cactiuser
        ALARMMANAGER_TEST_PASSWORD: cactiuser
        ALARMMANAGER_TEST_ALLOW_CREATE: '1'
      run: |
        cd ${{ github.workspace }}/cacti
        include/vendor/bin/pest --testsuite "Plugin Alarmmanager Integration" --configuration=plugins/alarmmanager/phpunit-integration.xml

    - name: Check the Gettext Template Freshness
      run: |
        cd ${{ github.workspace }}/cacti/plugins/alarmmanager
        cp locales/po/alarmmanager.pot /tmp/alarmmanager.pot.before
        locales/build_gettext.sh >/dev/null
        sed -E 's/^"POT-Creation-Date:.+$//' /tmp/alarmmanager.pot.before > /tmp/alarmmanager.pot.before.norm
        sed -E 's/^"POT-Creation-Date:.+$//' locales/po/alarmmanager.pot > /tmp/alarmmanager.pot.after.norm
        diff -u /tmp/alarmmanager.pot.before.norm /tmp/alarmmanager.pot.after.norm || {
          echo "alarmmanager.pot is stale; run locales/build_gettext.sh and commit the result"
          exit 1
        }

    - name: View Cacti Logs
      if: always()
      run: |
        if [ -f ${{ github.workspace }}/cacti/log/cacti.log ]; then
          echo "=== Cacti Log ==="
          sudo cat ${{ github.workspace }}/cacti/log/cacti.log
        fi

    - name: Run Coding Standards Check
      if: matrix.cacti == 'develop'
      run: |
        cd ${{ github.workspace }}/cacti
        include/vendor/bin/php-cs-fixer fix --dry-run --diff --config=plugins/alarmmanager/.php-cs-fixer.php

    - name: Run PHPStan at Level 6
      if: matrix.cacti == 'develop'
      run: |
        cd ${{ github.workspace }}/cacti/plugins/alarmmanager
        ../../include/vendor/bin/phpstan analyse --configuration=.phpstan.neon --no-progress